name: Release

on:
  push:
    branches: [ main ]
    paths:
      - ".fossify/release-marker.txt"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "$secret_name is required to sign release APKs." >&2
              exit 1
            fi
          done

          keystore_path="$RUNNER_TEMP/gallery-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "SIGNING_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed FOSS APKs
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: nix develop --command ./gradlew --no-daemon assembleFossRelease -PABI_SPLITS=true

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^VERSION_NAME=//p' gradle.properties | head -n 1)"
          if [[ -z "$version_name" ]]; then
            echo "VERSION_NAME is missing from gradle.properties." >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/foss/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APKs were generated." >&2
            exit 1
          fi

          nix develop --command gh release create "$VERSION_NAME" "${apks[@]}" \
            --title "$VERSION_NAME" \
            --generate-notes \
            --target "$GITHUB_SHA"
